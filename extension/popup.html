<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #060911;
      color: #e2e8f0;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .logo {
      font-size: 13px;
      font-weight: bold;
      color: #6366f1;
    }
    textarea {
      width: 100%;
      height: 90px;
      box-sizing: border-box;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #f1f5f9;
      padding: 8px;
      font-size: 11px;
      resize: vertical;
    }
    button {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
    }
    button:hover {
      background: #4338ca;
    }
    #result-box {
      margin-top: 10px;
      padding: 10px;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">Ψ VeritasDoc AI Inspector</span>
    <span style="font-size:10px; color:#94a3b8;">AI Content Detector</span>
  </div>
  <textarea id="inspect-text" placeholder="Paste student text here (minimum 50 words)..."></textarea>
  <button id="inspect-btn">Execute Forensic Inspection</button>
  <div id="result-box">
    <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
      <span id="res-verdict" style="font-weight:bold; font-size:12px;"></span>
      <span id="res-score" style="font-weight:bold; font-size:13px;"></span>
    </div>
    <div id="res-details" style="font-size:10px; color:#94a3b8; line-height:1.4;"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
